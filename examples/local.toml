goal = "PCMのLax接続を探す。最初にカレント自身を検査し、不十分なら検証結果からansatzを修正する。"

[model]
# S = action_prefactor * integral dx_plus dx_minus tr(j_plus j_minus), g in SU(2).
action_prefactor = "-1/(2*kappa**2)"

[llm]
kind = "local"
# Replace the portion after openai/ with the model ID loaded in the local server.
model = "openai/local-model"
api_base = "http://127.0.0.1:1234/v1"
json_mode = false

[limits]
max_steps = 6
max_llm_calls = 6
total_seconds = 300.0
tool_seconds = 30.0
llm_seconds = 60.0
max_output_tokens = 2048
total_output_tokens = 12288
