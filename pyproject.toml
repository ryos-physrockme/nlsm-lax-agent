[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nlsm-lax-agent"
version = "0.1.0"
description = "Exact PCM Lax calculations, MCP tools and a bounded search agent"
requires-python = ">=3.11"
dependencies = ["sympy>=1.14,<2", "pydantic>=2.11,<3"]

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]
agent = ["langgraph>=1,<2", "litellm>=1.80,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
nlsm-lax = "nlsm_lax_agent.cli:main"
nlsm-lax-mcp = "nlsm_lax_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
